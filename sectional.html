<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sectional Mocks — ScoreConsole</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0e15;--card:#151a26;--card2:#1a2030;--bd:rgba(255,255,255,.07);--f1:rgba(255,255,255,.035);--f2:rgba(255,255,255,.07);--t1:rgba(255,255,255,.94);--t2:rgba(255,255,255,.66);--t3:rgba(255,255,255,.42);--ind:#878dff;--grn:#46c98f;--amb:#f0bd6a;--red:#fb7185;--ink:#0f1118;--sh:0 8px 28px rgba(0,0,0,.28)}
html.sc-light{--bg:#F3F5FA;--card:#fff;--card2:#fff;--bd:#E5E8F2;--f1:#F6F7FC;--f2:#ECEFF6;--t1:#171B2E;--t2:rgba(23,27,46,.68);--t3:rgba(23,27,46,.45);--ind:#585EE6;--grn:#0E9F6E;--amb:#B45309;--red:#E5484D;--ink:#fff;--sh:0 8px 24px -12px rgba(23,27,46,.14)}
html.sc-parch{--bg:#f5f0e8;--card:#fbf8f2;--card2:#f6f0e4;--bd:rgba(90,70,40,.14);--f1:rgba(90,70,40,.04);--f2:rgba(90,70,40,.09);--t1:#2d2518;--t2:rgba(45,37,24,.72);--t3:rgba(45,37,24,.5);--ind:#5c7a5a;--grn:#5c7a5a;--amb:#c47f2a;--red:#b85c38;--ink:#fff;--sh:0 6px 20px rgba(90,70,40,.1)}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1,.num{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px}.sub{font-size:12px;color:var(--t3);margin-top:2px}
a.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t2);text-decoration:none;padding:7px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--f1)}
a.back:hover{color:var(--ind)}
.tabs{display:inline-flex;gap:2px;background:var(--f1);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{font:600 12.5px 'Hanken Grotesk';padding:7px 18px;border-radius:8px;border:none;background:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%}.tab.on{background:var(--f2);color:var(--t1)}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}.sticky{position:static!important}}
.sticky{position:sticky;top:16px}
.card{background:linear-gradient(155deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.ct{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
label.l{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
input.f,.dbtn{width:100%;height:36px;background:var(--f1);border:1px solid var(--bd);border-radius:9px;color:var(--t1);font:600 13px 'Hanken Grotesk';padding:0 11px;outline:none;color-scheme:dark}
html.sc-light input.f,html.sc-parch input.f{color-scheme:light}
input.f:focus,.dbtn:focus{border-color:var(--ind);box-shadow:0 0 0 3px color-mix(in srgb,var(--ind) 18%,transparent)}
input.f::placeholder{color:var(--t3);font-weight:500}
.dbtn{text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px}.dbtn i{color:var(--ind)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;position:relative}
.pop{position:absolute;top:60px;left:0;z-index:20;width:236px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;box-shadow:0 16px 40px rgba(0,0,0,.4);display:none}
.pop.open{display:block}
.ch{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.ch button{background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;width:26px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg i{font-size:9px;font-style:normal;font-weight:700;color:var(--t3);padding:3px 0}
.cg button{aspect-ratio:1;border:none;background:none;border-radius:6px;font:600 11px 'Hanken Grotesk';color:var(--t2);cursor:pointer}
.cg button:hover{background:var(--f2)}.cg button.on{background:var(--ind);color:var(--ink)}.cg button.td{outline:1px solid var(--ind)}
.hd,.sr{display:grid;grid-template-columns:1fr 60px 60px 46px;gap:8px;align-items:center}
.hd{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;text-align:center}.hd span:first-child{text-align:left}
.sr{margin-bottom:8px}.sr .n{font-size:12.5px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sr input{height:32px;text-align:center;padding:0 4px}.sr .a{font:600 13px 'Fraunces',serif;text-align:right}
.tot{display:flex;justify-content:space-between;align-items:center;margin:12px 0;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--t2)}
.chip{font:600 17px 'Fraunces',serif;padding:3px 12px;border-radius:100px;border:1px solid;transition:all .2s}
.btn{height:40px;border:none;border-radius:10px;background:var(--ind);color:var(--ink);font:700 13px 'Hanken Grotesk';cursor:pointer;flex:1}
.btn.g{flex:0 0 auto;padding:0 16px;background:var(--f2);color:var(--t2)}
.btn:disabled{opacity:.5}.btn:hover:not(:disabled){filter:brightness(1.08)}
.msg{font-size:11.5px;margin-top:8px;min-height:14px;color:var(--t3)}
.edit{display:none;align-items:center;gap:8px;padding:8px 11px;margin-bottom:12px;border-radius:9px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--amb) 14%,transparent);border:1px solid color-mix(in srgb,var(--amb) 35%,transparent);color:var(--amb)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--f1);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:600 25px 'Fraunces',serif;line-height:1}
.kpi span{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);display:block;margin-top:7px}
.kpi small{display:block;font-size:11px;font-weight:600;margin-top:3px;color:var(--t3)}
.ch2{position:relative;height:250px}
.leg{font-size:10.5px;color:var(--t3);font-weight:500;text-transform:none;letter-spacing:0}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mc{background:var(--f1);border:1px solid var(--bd);border-radius:12px;padding:11px 12px 6px}
.mc .h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:650;color:var(--t2);margin-bottom:2px}
.mc .h b{font:600 18px 'Fraunces',serif}.mc .s{font-size:10.5px;color:var(--t3)}.mc .cv{height:52px;margin-top:4px}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fc{font:600 11.5px 'Hanken Grotesk';padding:5px 12px;border-radius:100px;border:1px solid var(--bd);background:none;color:var(--t2);cursor:pointer}
.fc.on{background:var(--f2);color:var(--t1);border-color:var(--t3)}
.fl input{flex:1;min-width:120px;height:30px;font-size:12px;border-radius:100px}
.mh{display:flex;justify-content:space-between;align-items:center;margin:14px 0 7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--t3)}
.hist{display:flex;align-items:center;gap:11px;padding:10px 12px 10px 14px;border-radius:10px;background:var(--f1);border:1px solid var(--bd);margin-bottom:6px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.hist:hover{transform:translateY(-2px);border-color:var(--t3)}
.hist:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.hist .m{flex:1;min-width:0}.hist .t{font-size:12.5px;font-weight:650}.hist .t em{font-style:normal;color:var(--t3);font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:100px;border:1px solid}
.hist .pc{font:600 18px 'Fraunces',serif}
.ib{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:5px;border-radius:6px}.ib:hover{color:var(--ind);background:var(--f2)}.ib.d:hover{color:var(--red)}
.empty{text-align:center;color:var(--t3);font-size:12.5px;padding:28px 12px;line-height:1.6}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--f1),var(--f2),var(--f1));background-size:200% 100%;animation:sk 1.3s infinite;height:60px}
@keyframes sk{to{background-position:-200% 0}}
.err{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.3);color:var(--red);padding:12px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.open{display:flex}.ov .bx{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:340px;text-align:center}
.ov h3{font:600 17px 'Fraunces',serif;margin-bottom:6px}.ov p{font-size:13px;color:var(--t2);margin-bottom:18px}.ov .acts{display:flex;gap:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Sectional Mocks</h1><div class="sub">Log right/wrong by subsection and track accuracy over time</div></div>
    <a class="back" href="/app.html"><i class="ti ti-arrow-left"></i> Dashboard</a>
  </div>
  <div class="err" id="err"></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid">
    <div class="sticky">
      <div class="card">
        <div class="ct"><span id="f-title">Log a sectional</span><span id="f-sec"></span></div>
        <div class="edit" id="f-edit"><i class="ti ti-pencil"></i><span id="f-edit-t"></span></div>
        <div class="row2">
          <div><label class="l">Date</label><button class="dbtn" id="f-date" type="button"><i class="ti ti-calendar"></i><span id="f-date-t"></span></button></div>
          <div><label class="l">Mock / source</label><input class="f" id="f-name" type="text" placeholder="e.g. SM Quant Quiz 7"></div>
          <div class="pop" id="pop"></div>
        </div>
        <div class="hd"><span>Subsection</span><span>Right</span><span>Wrong</span><span>Acc</span></div>
        <div id="f-rows"></div>
        <div class="tot"><span>Section total <span id="f-tc"></span></span><span class="chip" id="f-tp" style="color:var(--t3);border-color:var(--bd)">—</span></div>
        <div style="display:flex;gap:8px"><button class="btn" id="f-save">Save sectional</button><button class="btn g" id="f-cancel" style="display:none">Cancel</button></div>
        <div class="msg" id="f-msg"></div>
      </div>
    </div>
    <div>
      <div class="kpis" id="kpis"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
      <div class="card"><div class="ct">Section accuracy over time <span class="leg">Click a name to hide · shaded band is the 75% goal</span></div><div class="ch2"><canvas id="c-sec"></canvas></div></div>
      <div class="card"><div class="ct"><span id="sub-t">Subsections</span><span class="leg">Latest and average</span></div><div class="mini" id="mini"></div></div>
      <div class="card"><div class="ct">History</div>
        <div class="fl" id="fl"></div>
        <div id="hist"><div class="sk"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="ov" id="ov"><div class="bx"><h3 id="ov-t"></h3><p id="ov-p"></p><div class="acts"><button class="btn g" id="ov-n" style="flex:1">Cancel</button><button class="btn" id="ov-y" style="background:var(--red)">Delete</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Run once in Supabase SQL editor (if not already done):
 create table if not exists sectional_attempts (id uuid primary key default gen_random_uuid(), user_id uuid not null references auth.users(id) on delete cascade, mock_date date not null, mock_name text, section text not null, subsection text not null, correct int not null default 0, wrong int not null default 0, logged_at timestamptz not null default now());
 alter table sectional_attempts enable row level security;
 create policy "own rows" on sectional_attempts for all using (auth.uid()=user_id) with check (auth.uid()=user_id);
*/
const supa=supabase.createClient('https://zglxfaarezgyibewtmbh.supabase.co','sb_publishable_24bSL5sfl-tRgRLtik1qNA_NdexORqM');
try{const t=localStorage.getItem('sc_theme');if(t==='light')document.documentElement.classList.add('sc-light');if(t==='parch')document.documentElement.classList.add('sc-parch')}catch(e){}

// Shared section colours — mirror these in the TC map in app.html
const TC={Quant:'#8b7cf8',Verbal:'#34d399',DI:'#fbbf24'};
const SECTIONS={
  Verbal:{subs:['RC','CR']},
  Quant:{subs:['Algebra','Number Properties','Advanced Topics','Word Problems','Misc']},
  DI:{subs:['Data Sufficiency','Two-Part Analysis','Multi-Source Reasoning','Graphs and Table Analysis']}
};
const HUE={Quant:252,Verbal:160,DI:42};
const subCol=(s,i)=>`hsl(${HUE[s]+(i-2)*9} 68% ${46+i*5}%)`;
// One accuracy scale: <55 red, 55–74 amber, 75+ green
const AC=p=>p==null?'var(--t3)':p>=75?'var(--grn)':p>=55?'var(--amb)':'var(--red)';
const ACH=p=>p>=75?'#46c98f':p>=55?'#f0bd6a':'#fb7185';
let uid=null,rows=[],active='Verbal',charts={},hf='All',q='',editG=null,pd='',cm=new Date(),loaded=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(c,w)=>(c+w)>0?Math.round(c/(c+w)*100):null;
const P=p=>p==null?'—':p+'%';
const ds2=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ds2(new Date());
const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const sd=s=>new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function fail(m){const e=$('err');e.textContent=m;e.style.display='block'}
function count(el,to,suf){if(to==null||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=to==null?'—':to+suf;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf;if(k<1)requestAnimationFrame(f)})(t0)}
function ask(t,p,ok){return new Promise(r=>{$('ov-t').textContent=t;$('ov-p').textContent=p;$('ov-y').textContent=ok;$('ov').classList.add('open');const d=v=>{$('ov').classList.remove('open');r(v)};$('ov-y').onclick=()=>d(true);$('ov-n').onclick=()=>d(false)})}

async function init(){
  const {data:{session}}=await supa.auth.getSession();
  if(!session){fail('Not signed in — redirecting to dashboard…');setTimeout(()=>location.href='/app.html',1200);return}
  uid=session.user.id;pd=todayStr();
  drawTabs();drawForm();drawFilters();await load();
}
async function load(){
  const {data,error}=await supa.from('sectional_attempts').select('*').eq('user_id',uid).order('mock_date',{ascending:true}).order('logged_at',{ascending:true}).limit(5000);
  if(error){fail('Database error: '+error.message+' — create the sectional_attempts table (SQL is at the top of the script).');return}
  rows=data||[];loaded=true;renderAll();
}

/* ── date picker ── */
function drawCal(){
  const y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=`<div class="ch"><button data-n="-1">‹</button><b>${cm.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button data-n="1">›</button></div><div class="cg">`+'MTWTFSS'.split('').map(d=>`<i>${d}</i>`).join('')+'<span></span>'.repeat(first);
  for(let d=1;d<=n;d++){const s=ds2(new Date(y,m,d));h+=`<button data-d="${s}" class="${s===pd?'on':''} ${s===todayStr()?'td':''}">${d}</button>`}
  $('pop').innerHTML=h+'</div>';
}
$('f-date').onclick=e=>{e.stopPropagation();cm=new Date(pd+'T00:00:00');drawCal();$('pop').classList.toggle('open')};
$('pop').onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;if(b.dataset.n){cm.setMonth(cm.getMonth()+ +b.dataset.n);drawCal()}else{pd=b.dataset.d;$('f-date-t').textContent=fmtD(pd);$('pop').classList.remove('open')}};
document.addEventListener('click',()=>$('pop').classList.remove('open'));

/* ── tabs + form ── */
function drawTabs(){
  $('tabs').innerHTML=Object.keys(SECTIONS).map(s=>`<button class="tab ${s===active?'on':''}" data-s="${s}"><i style="background:${TC[s]}"></i>${s}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(editG)exitEdit();active=b.dataset.s;drawTabs();drawForm();renderAll()});
}
function drawForm(vals){
  const S=SECTIONS[active];
  $('f-sec').textContent=active;$('f-sec').style.color=TC[active];
  $('f-date-t').textContent=fmtD(pd);
  $('f-rows').innerHTML=S.subs.map((n,i)=>`<div class="sr"><div class="n"><span class="dot" style="background:${subCol(active,i)}"></span>${n}</div>
    <input class="f" type="number" min="0" inputmode="numeric" id="r${i}" placeholder="0" value="${vals?vals[i].c||'':''}"><input class="f" type="number" min="0" inputmode="numeric" id="w${i}" placeholder="0" value="${vals?vals[i].w||'':''}"><div class="a" id="a${i}">—</div></div>`).join('');
  S.subs.forEach((_,i)=>{$('r'+i).oninput=$('w'+i).oninput=recalc});recalc();
}
const vals=()=>SECTIONS[active].subs.map((n,i)=>({n,c:parseInt($('r'+i).value,10)||0,w:parseInt($('w'+i).value,10)||0}));
function recalc(){
  let C=0,W=0;
  vals().forEach((v,i)=>{const p=pct(v.c,v.w);$('a'+i).textContent=P(p);$('a'+i).style.color=AC(p);C+=v.c;W+=v.w});
  const p=pct(C,W),c=$('f-tp');c.textContent=P(p);c.style.color=AC(p);c.style.borderColor=p==null?'var(--bd)':AC(p);
  c.style.background=p==null?'none':`color-mix(in srgb,${AC(p)} 12%,transparent)`;
  $('f-tc').textContent=(C+W)?`(${C}/${C+W})`:'';
}
function exitEdit(){editG=null;$('f-edit').style.display='none';$('f-cancel').style.display='none';$('f-title').textContent='Log a sectional';$('f-save').textContent='Save sectional';$('f-name').value='';pd=todayStr();drawForm()}
$('f-cancel').onclick=exitEdit;
function startEdit(key){
  const g=groups(rows)[key];if(!g)return;const f=g[0];
  editG=g;active=f.section;pd=f.mock_date;drawTabs();
  const v=SECTIONS[active].subs.map(n=>{const r=g.find(x=>x.subsection===n);return {c:r?r.correct:0,w:r?r.wrong:0}});
  drawForm(v);$('f-name').value=f.mock_name||'';
  $('f-edit').style.display='flex';$('f-edit-t').textContent='Editing · '+(f.mock_name||'Untitled')+' · '+sd(f.mock_date);
  $('f-cancel').style.display='block';$('f-title').textContent='Edit sectional';$('f-save').textContent='Update sectional';
  scrollTo({top:0,behavior:'smooth'});renderAll();
}
$('f-save').onclick=async()=>{
  const name=$('f-name').value.trim()||null,v=vals();
  if(!pd){$('f-msg').textContent='Pick a date.';return}
  if(!v.some(x=>x.c+x.w>0)){$('f-msg').textContent='Enter right/wrong for at least one subsection.';return}
  $('f-save').disabled=true;$('f-msg').style.color='var(--t3)';$('f-msg').textContent='Saving…';
  let err=null;
  if(editG){
    for(const x of v){
      const ex=editG.find(r=>r.subsection===x.n),has=x.c+x.w>0;
      let res;
      if(ex&&has)res=await supa.from('sectional_attempts').update({mock_date:pd,mock_name:name,correct:x.c,wrong:x.w}).eq('id',ex.id);
      else if(ex)res=await supa.from('sectional_attempts').delete().eq('id',ex.id);
      else if(has)res=await supa.from('sectional_attempts').insert({user_id:uid,mock_date:pd,mock_name:name,section:active,subsection:x.n,correct:x.c,wrong:x.w});
      if(res&&res.error){err=res.error;break}
    }
    // keep untouched siblings in step with the new date/name
  }else{
    err=(await supa.from('sectional_attempts').insert(v.filter(x=>x.c+x.w>0).map(x=>({user_id:uid,mock_date:pd,mock_name:name,section:active,subsection:x.n,correct:x.c,wrong:x.w})))).error;
  }
  $('f-save').disabled=false;
  if(err){$('f-msg').style.color='var(--red)';$('f-msg').textContent='Error: '+err.message;return}
  $('f-msg').style.color='var(--grn)';$('f-msg').textContent=editG?'✓ Updated':'✓ Saved';
  const was=editG;if(was)exitEdit();else{drawForm();$('f-name').value=''}
  await load();
};

/* ── data helpers ── */
const agg=l=>l.reduce((a,r)=>{a.c+=r.correct;a.w+=r.wrong;return a},{c:0,w:0});
function groups(list){const g={};list.forEach(r=>{const k=r.section+'|'+r.mock_date+'|'+(r.mock_name||'');(g[k]=g[k]||[]).push(r)});return g}
function series(list,filter){ // [{x,y}] one point per date
  const ds=[...new Set(list.filter(filter).map(r=>r.mock_date))].sort();
  return ds.map(d=>{const a=agg(list.filter(r=>r.mock_date===d&&filter(r)));return {x:new Date(d+'T00:00:00').getTime(),y:pct(a.c,a.w),d}});
}
const band={id:'band',beforeDatasetsDraw(c){const {ctx,chartArea:a,scales:{y}}=c;if(!y)return;const y75=y.getPixelForValue(75),y100=y.getPixelForValue(100);ctx.save();ctx.fillStyle='rgba(70,201,143,.07)';ctx.fillRect(a.left,y100,a.right-a.left,y75-y100);ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(70,201,143,.55)';ctx.beginPath();ctx.moveTo(a.left,y75);ctx.lineTo(a.right,y75);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(70,201,143,.8)';ctx.font='600 10px Hanken Grotesk';ctx.fillText('Goal 75%',a.left+6,y75-5);ctx.restore()}};
function xr(pts){let a=Math.min(...pts.map(p=>p.x)),b=Math.max(...pts.map(p=>p.x));if(a===b){a-=864e5*2;b+=864e5*2}return {min:a-864e5,max:b+864e5}}

function renderAll(){
  const mine=rows.filter(r=>r.section===active),A=agg(mine);
  /* KPIs */
  const sit=series(mine,()=>true),last=sit[sit.length-1],prev=sit[sit.length-2];
  const best=sit.length?sit.reduce((a,b)=>b.y>a.y?b:a):null;
  const avg=a=>a.length?a.reduce((s,p)=>s+p.y,0)/a.length:null;
  const r3=avg(sit.slice(-3)),p3=sit.length>3?avg(sit.slice(-6,-3)):null;
  const tr=p3==null?['—','Need 4+ sittings']:r3-p3>=2?['▲ Rising','last 3 vs prior 3']:r3-p3<=-2?['▼ Falling','last 3 vs prior 3']:['▬ Steady','last 3 vs prior 3'];
  const ov=A.c+A.w?pct(A.c,A.w):null,dl=last&&prev?last.y-prev.y:null;
  const k=(v,l,s,c,sc)=>`<div class="kpi"><b class="num" style="color:${c}" data-n="${v==null?'':v}" data-s="${sc||''}">${v==null?'—':v+(sc||'')}</b><span>${l}</span><small${s[1]?` style="color:${s[1]}"`:''}>${s[0]}</small></div>`;
  $('kpis').innerHTML=k(ov,'Overall '+active,[mine.length?(A.c+A.w)+' questions':'No data yet'],AC(ov),'%')
    +k(last?last.y:null,'Latest sitting',[dl==null?(last?sd(last.d):'—'):(dl>=0?'▲ +':'▼ ')+dl+' vs previous',dl==null?'':dl>=0?'var(--grn)':'var(--red)'],AC(last?last.y:null),'%')
    +k(best?best.y:null,'Best sitting',[best?sd(best.d):'—'],AC(best?best.y:null),'%')
    +k(sit.length,'Sittings',[tr[0]+(p3!=null?'':''),tr[0].startsWith('▲')?'var(--grn)':tr[0].startsWith('▼')?'var(--red)':''],'var(--t1)','');
  $('kpis').querySelectorAll('b').forEach(b=>{if(b.dataset.n!=='')count(b,+b.dataset.n,b.dataset.s)});

  /* section chart */
  const tick=css('--t3'),grid=css('--f2');
  const all=Object.keys(SECTIONS).map(s=>({s,pts:series(rows,r=>r.section===s)}));
  const allPts=all.flatMap(o=>o.pts);
  if(charts.sec)charts.sec.destroy();
  if(allPts.length){
    const rg=xr(allPts);
    charts.sec=new Chart($('c-sec'),{type:'line',plugins:[band],data:{datasets:all.map(o=>({label:o.s,data:o.pts,borderColor:TC[o.s],backgroundColor:TC[o.s],borderWidth:o.s===active?2.8:1.8,tension:.35,cubicInterpolationMode:'monotone',pointRadius:o.s===active?4:3,pointBackgroundColor:o.pts.map(p=>ACH(p.y)),pointBorderColor:TC[o.s],pointBorderWidth:1.5,pointHoverRadius:6}))},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
        plugins:{legend:{labels:{color:tick,boxWidth:8,boxHeight:8,usePointStyle:true,font:{size:10}}},tooltip:{callbacks:{title:i=>sd(i[0].raw.d),label:c=>`${c.dataset.label}: ${c.parsed.y}%`}}},
        scales:{y:{min:0,max:100,grid:{color:grid},border:{display:false},ticks:{color:tick,callback:v=>v+'%',stepSize:25}},
          x:{type:'linear',min:rg.min,max:rg.max,grid:{display:false},border:{display:false},ticks:{color:tick,maxRotation:0,maxTicksLimit:6,callback:v=>sd(ds2(new Date(v)))}}}}});
  }
  /* subsection small multiples */
  Object.keys(charts).filter(k=>k.startsWith('m')).forEach(k=>{charts[k].destroy();delete charts[k]});
  $('sub-t').textContent=active+' subsections';
  const S=SECTIONS[active];
  $('mini').innerHTML=mine.length?S.subs.map((n,i)=>{const a=agg(mine.filter(r=>r.subsection===n)),pts=series(mine,r=>r.subsection===n),l=pts[pts.length-1];
    return `<div class="mc"><div class="h"><span><i class="dot" style="background:${subCol(active,i)};display:inline-block;margin-right:6px"></i>${n}</span><b style="color:${AC(l?l.y:null)}">${l?P(l.y):'—'}</b></div><div class="s">avg ${P(pct(a.c,a.w))} · ${a.c+a.w}q</div><div class="cv"><canvas id="m${i}"></canvas></div></div>`}).join('')
    :`<div class="empty" style="grid-column:1/-1">No ${active} sectionals logged yet.<br>Log your first one on the left to see subsection trends.</div>`;
  if(mine.length)S.subs.forEach((n,i)=>{const pts=series(mine,r=>r.subsection===n);if(!pts.length)return;const rg=xr(pts);
    charts['m'+i]=new Chart($('m'+i),{type:'line',plugins:[band],data:{datasets:[{data:pts,borderColor:subCol(active,i),borderWidth:2,tension:.35,cubicInterpolationMode:'monotone',pointRadius:3,pointBackgroundColor:pts.map(p=>ACH(p.y)),pointBorderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>sd(i[0].raw.d),label:c=>c.parsed.y+'%'}}},scales:{y:{min:0,max:100,display:false},x:{type:'linear',min:rg.min,max:rg.max,display:false}}}})});
  renderHist();
}

/* ── history ── */
function drawFilters(){
  $('fl').innerHTML=['All','Quant','Verbal','DI'].map(s=>`<button class="fc ${hf===s?'on':''}" data-s="${s}">${s}</button>`).join('')+'<input class="f" id="q" placeholder="Search source, subsection or date" value="'+esc(q)+'">';
  $('fl').querySelectorAll('.fc').forEach(b=>b.onclick=()=>{hf=b.dataset.s;drawFilters();renderHist()});
  $('q').oninput=e=>{q=e.target.value.toLowerCase();renderHist()};
}
function renderHist(){
  if(!loaded)return;
  const G=groups(rows),keys=Object.keys(G).filter(k=>{const g=G[k],f=g[0];
    if(hf!=='All'&&f.section!==hf)return false;
    return !q||(f.mock_name||'').toLowerCase().includes(q)||f.mock_date.includes(q)||g.some(r=>r.subsection.toLowerCase().includes(q))});
  keys.sort((a,b)=>G[b][0].mock_date.localeCompare(G[a][0].mock_date));
  if(!keys.length){$('hist').innerHTML=`<div class="empty">${rows.length?'No sectionals match these filters.':'No sectionals logged yet.<br>Enter right/wrong counts on the left and save your first one.'}</div>`;return}
  const months={},order=[];
  keys.forEach(k=>{const m=G[k][0].mock_date.slice(0,7);if(!months[m]){months[m]=[];order.push(m)}months[m].push(k)});
  $('hist').innerHTML=order.map(m=>{const a=agg(months[m].flatMap(k=>G[k])),p=pct(a.c,a.w);
    const label=new Date(m+'-01T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
    return `<div class="mh"><span>${label}</span><span>${months[m].length} sitting${months[m].length>1?'s':''} · avg <b style="color:${AC(p)}">${P(p)}</b></span></div>`+months[m].map(k=>{
      const g=G[k],f=g[0],t=agg(g),p2=pct(t.c,t.w),c=TC[f.section];
      const pills=g.map(r=>{const pp=pct(r.correct,r.wrong),col=AC(pp);return `<span class="pill" style="color:${col};border-color:color-mix(in srgb,${col} 35%,transparent);background:color-mix(in srgb,${col} 10%,transparent)">${esc(r.subsection)} ${r.correct}/${r.correct+r.wrong}</span>`}).join('');
      return `<div class="hist" style="--c:${c}"><div class="m"><div class="t">${esc(f.mock_name||'Untitled')} <em>· ${f.section} · ${sd(f.mock_date)}</em></div><div class="pills">${pills}</div></div>
        <div class="pc" style="color:${AC(p2)}">${P(p2)}</div><button class="ib" data-e="${esc(k)}" title="Edit"><i class="ti ti-pencil"></i></button><button class="ib d" data-d="${esc(k)}" title="Delete"><i class="ti ti-trash"></i></button></div>`}).join('')}).join('');
  $('hist').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>startEdit(b.dataset.e));
  $('hist').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
    const g=G[b.dataset.d];
    if(!await ask('Delete this sectional?',(g[0].mock_name||'Untitled')+' · '+sd(g[0].mock_date)+' will be removed permanently.','Delete'))return;
    const {error}=await supa.from('sectional_attempts').delete().in('id',g.map(r=>r.id));
    if(error)fail(error.message);else{if(editG&&editG[0].id===g[0].id)exitEdit();load()}
  });
}
init();
</script>
