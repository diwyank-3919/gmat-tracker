<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya's CR Error Log — GMAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f2f0ec;
    --border: #e4e1da;
    --border-strong: #c8c4bb;
    --text: #1a1917;
    --text-2: #6b6760;
    --text-3: #9e9b96;
    --accent: #2a5c8a;
    --accent-light: #eaf2fb;
    --accent-mid: #6eaadf;
    --red: #c0392b;
    --red-light: #fdf0ee;
    --red-mid: #e08070;
    --green: #1a6b45;
    --green-light: #eef7f2;
    --green-mid: #5aab82;
    --amber: #8a5e00;
    --amber-light: #fdf5e6;
    --amber-mid: #d4a020;
    --purple: #5b3e8a;
    --purple-light: #f3effe;
    --teal: #1a6b6b;
    --teal-light: #eaf6f6;
    --coral: #8a3a2a;
    --coral-light: #fef0ee;
    --font-sans: 'Inter', system-ui, sans-serif;
    --font-serif: 'Lora', Georgia, serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 20px;
    height: 56px;
  }

  .header-logo {
    font-family: var(--font-serif);
    font-size: 18px;
    font-style: italic;
    color: var(--accent);
    white-space: nowrap;
    letter-spacing: -0.3px;
  }

  .header-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

  .header-stats {
    display: flex;
    gap: 16px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .header-stats::-webkit-scrollbar { display: none; }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stat-pill .val { font-weight: 600; }
  .stat-pill.red .val { color: var(--red); }
  .stat-pill.green .val { color: var(--green); }
  .stat-pill.amber .val { color: var(--amber); }

  /* SIDEBAR + MAIN */
  .layout {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 16px;
    gap: 16px;
    align-items: flex-start;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    position: sticky;
    top: 72px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-3);
    padding: 10px 14px 6px;
  }

  .filter-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-2);
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    transition: background 0.1s;
    gap: 8px;
  }
  .filter-btn:hover { background: var(--surface2); }
  .filter-btn.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
  .filter-btn .badge {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--text-3);
    font-weight: 400;
    margin-left: auto;
  }
  .filter-btn.active .badge { color: var(--accent-mid); }

  .type-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* TRAP CLOUD */
  .trap-cloud {
    padding: 10px 12px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .trap-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .trap-tag:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .trap-tag.active { border-color: currentColor; font-weight: 500; }

  /* MAIN CONTENT */
  .main { flex: 1; min-width: 0; }

  /* SEARCH + SORT BAR */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-3);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    height: 38px;
    padding: 0 12px 0 38px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent-mid); }
  .search-input::placeholder { color: var(--text-3); }

  .sort-select {
    height: 38px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--text);
    outline: none;
    cursor: pointer;
    appearance: none;
    padding-right: 28px;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%239e9b96' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }

  .results-count {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
  }

  /* CARDS GRID */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--card-accent, transparent);
    transition: width 0.2s;
  }
  .card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .card:hover::before { width: 4px; }
  .card.wrong { --card-accent: #e08070; }
  .card.correct { --card-accent: #5aab82; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .card-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
    min-width: 22px;
  }

  .card-meta { flex: 1; min-width: 0; }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-badges {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  .badge-type {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge-diff {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .diff-H { background: #fdf0ee; color: #c0392b; }
  .diff-M { background: #fdf5e6; color: #8a5e00; }
  .diff-E { background: #eef7f2; color: #1a6b45; }

  .card-answer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-2);
  }

  .ans-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .ans-chip.correct { background: var(--green-light); color: var(--green); }
  .ans-chip.wrong { background: var(--red-light); color: var(--red); }
  .ans-chip.got-right { background: var(--accent-light); color: var(--accent); }

  .time-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    margin-left: auto;
  }

  /* TRAP HIGHLIGHT */
  .trap-banner {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--amber-light);
    border: 1px solid #f0d080;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    color: var(--amber);
    font-weight: 500;
    margin-bottom: 10px;
    animation: trapPulse 3s ease-in-out infinite;
  }
  .trap-banner svg { flex-shrink: 0; }

  @keyframes trapPulse {
    0%, 100% { border-color: #f0d080; }
    50% { border-color: #d4a020; }
  }

  .card-corrective {
    font-size: 12px;
    color: var(--text-2);
    border-left: 2px solid var(--accent-mid);
    padding-left: 10px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* EXPANDED MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 25, 23, 0.5);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    width: 100%;
    max-width: 680px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    transform: translateY(12px) scale(0.98);
    transition: transform 0.2s;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--surface2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    transition: background 0.1s;
  }
  .modal-close:hover { background: var(--border); }

  .modal-title {
    font-family: var(--font-serif);
    font-size: 20px;
    line-height: 1.3;
    margin-bottom: 8px;
    padding-right: 32px;
  }

  .modal-body { padding: 20px 24px 24px; }

  .modal-section {
    margin-bottom: 20px;
  }

  .modal-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .insights-list {
    list-style: none;
    counter-reset: insight;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .insights-list li {
    counter-increment: insight;
    display: flex;
    gap: 10px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .insights-list li::before {
    content: counter(insight);
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    margin-top: 2px;
    font-family: var(--font-mono);
  }

  .corrective-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .corrective-list li {
    display: flex;
    gap: 8px;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text);
    padding: 8px 12px;
    background: var(--accent-light);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--accent-mid);
  }

  .modal-trap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--amber-light);
    border: 1.5px solid #e0c060;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--amber);
    margin-bottom: 20px;
  }
  .modal-trap .trap-emoji { font-size: 20px; }

  .skill-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .skill-item {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    text-align: center;
  }
  .skill-label { font-size: 10px; color: var(--text-3); margin-bottom: 4px; line-height: 1.3; }
  .skill-val {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .skill-val.dw { background: var(--green-light); color: var(--green); }
  .skill-val.tried { background: var(--amber-light); color: var(--amber); }
  .skill-val.dnt { background: var(--red-light); color: var(--red); }
  .skill-val.empty { background: var(--surface); color: var(--text-3); border: 1px dashed var(--border); }

  /* PROGRESS BAR */
  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--red) 0%, var(--amber-mid) 50%, var(--green-mid) 100%);
    background-size: 200% 100%;
    transition: width 0.5s ease;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
  }
  .empty-state p { font-size: 14px; margin-top: 8px; }

  /* QUIZ DIVIDER */
  .quiz-divider {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    margin-top: 4px;
  }
  .quiz-divider-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-3);
    white-space: nowrap;
    background: var(--accent-light);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .quiz-divider-line { flex: 1; height: 1px; background: var(--border); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* FLASH animation for trap */
  @keyframes flashIn {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .card { animation: flashIn 0.15s ease; }

  /* Keyboard hint */
  .kbd-hint {
    font-size: 11px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 10px;
  }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .layout { padding: 12px; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">CR Error Log</div>
  <div class="header-divider"></div>
  <div class="header-stats" id="headerStats"></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Result</div>
      <button class="filter-btn active" data-filter="result" data-value="all" onclick="setFilter('result','all')">
        All questions <span class="badge" id="cnt-all">—</span>
      </button>
      <button class="filter-btn" data-filter="result" data-value="wrong" onclick="setFilter('result','wrong')">
        <span style="width:8px;height:8px;border-radius:50%;background:#e08070;flex-shrink:0;"></span>
        Wrong <span class="badge" id="cnt-wrong">—</span>
      </button>
      <button class="filter-btn" data-filter="result" data-value="correct" onclick="setFilter('result','correct')">
        <span style="width:8px;height:8px;border-radius:50%;background:#5aab82;flex-shrink:0;"></span>
        Correct <span class="badge" id="cnt-correct">—</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Difficulty</div>
      <button class="filter-btn" data-filter="diff" data-value="all" onclick="setFilter('diff','all')">All <span class="badge">—</span></button>
      <button class="filter-btn" data-filter="diff" data-value="H" onclick="setFilter('diff','H')">
        <span class="badge-diff diff-H">HARD</span> <span class="badge" id="cnt-H">—</span>
      </button>
      <button class="filter-btn" data-filter="diff" data-value="M" onclick="setFilter('diff','M')">
        <span class="badge-diff diff-M">MEDIUM</span> <span class="badge" id="cnt-M">—</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Question Type</div>
      <button class="filter-btn" data-filter="type" data-value="all" onclick="setFilter('type','all')">All types <span class="badge" id="cnt-type-all">—</span></button>
      <div id="typeFilters"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Top Traps</div>
      <div class="trap-cloud" id="trapCloud"></div>
    </div>
  </aside>

  <main class="main">
    <div class="controls">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" type="text" id="searchInput" placeholder="Search questions, traps, notes…" oninput="applyFilters()">
      </div>
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="default">Sort: Default</option>
        <option value="wrong-first">Wrong first</option>
        <option value="hard-first">Hard first</option>
        <option value="type">By type</option>
        <option value="trap">By trap</option>
      </select>
      <div class="results-count" id="resultsCount"></div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:91%"></div></div>

    <div class="cards-grid" id="cardsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No questions match your filters.</p>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div id="modalBadges" style="display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;"></div>
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="closeModalDirect()">

<script>
const DATA = [[1,"Strengthen","Marlandia Reptiles","M","E","E","0:00",1,"Not found -> does not exist","1. An anwer choice can be related to our\nprethought idea, but still worded in an \nincorrect way\n2. No fossil have been found does not mean that fossil does not exist","1. has not been found doesn't mean it does not exist","CR Medium Cementing  Prep OG questions","Not able to \napply framewrok quickly"],[2,"Weaken","Earthlike Worlds","M","C","A","0:00",0,"Not attempted -> Different  Results","Something astromers does not attempt to \nstudy  does not mean that it will lead to different result.\nHence it does not weaken the authors conculsion from sample data","1. something has'nt been tried is open for interpretation - it can be aligned to the authors finding and cannot, always question such choices","CR Medium Cementing  Prep OG questions","Answer Choice Analysis"],[3,"Inference","Ground Water Scarcity","M","B","C","13:00",0,"Existing System Fails","1. Passage has given that only way\nto meet water demand is rainwater harvesting\n2. I should have thought on those lines only\n3. I couldn't think that maybe rainwater \nharvesting is currently not very efficient and can be improved then the people shouldn't have to reduce their water consumption severly\n4. I was confuse between B and C, and rejected B as it starts with Unless it figures out a way.., Unless word put me off,It seemed to me as a must be true, what if other options are available but in the passage it was clearly mentioned that rainwater harvesting is the only other option available.","1. Words like only/all/most can be a great clue to select/reject an answer choice, never ever ignore such words, they turn the meaning upside down, on the brighter side they are helpful in narrowing the scope of the argument and hence rejecting/selecting an option choice becomes easy\n2. If a process already exist or used by people, you can always question it if it is getting used in an efficient w","Medium Cementing  Quiz 1",""],[4,"Assumption","Tranquilizer Spray  Vs Injection","M","B","B","33:00",1,"Correlation Vs  Cause and Effect","1. I was unable to come up with an assumption scenario\n2. Two factors were there delivery time and time to tranquilize.\n3. Author concluded since time to tranquilize is less for injection, injection is more effective than sprays\n4. I couldn't think that to arrive at such a conclusion, there must be some relationship exiist between time to tranquilize and effectiveness\n5. And if it does not exist the concluion will break and hence that connection must be our assumption","1. When an author relates two qualities always question the basis of such conclusion","Medium Cementing  Quiz 1",""],[5,"Bold Face","Traditional Lecture  Based Teaching Methods","M","A","E","14:00",0,"Reference Change","1. Correct option choice A looked okay to me at first glance but when I comapared with E, that choice seemed attaractive but couldn't find the trap\n2. Rejected A just because it used a word older to refer traditional methods\n3. And chose E as I found no issues there\n4. But the rationale provided by consultant was wrong, I didn't cross check, It was the university that provided the rationale not the consultant\n5. The second part of the bold face was also wrong as I couldn't catch the issue with the first boldface , in 2nd boldface it mentioned that rationale which was of the univeristy and not ","1. Don't fall for the attractive option choices trap, reject/select options on solid grounds\n2. Option choices may not use the exact same words given in the passage, even different words can tell the same meaning, never reject on the basis of different vocab\n3. Read carefully the option choices and always verify each word from the passage, sometimes even a small refernce change can make you fall i","Medium Cementing  Quiz 1",""],[6,"Other","CyberSecurity Breaches","M","C","C","10:00",1,"Direct vs Indirect  Explaination","1. This question has a very subtle difference in the correct and incorrect choice\n2. Companies with updated tech infra reduced their investment in employee security training\nprograms, this is giving indirect explanation by suggesting reduced training makes employees more vulnerable to social engineering \n3. I rejected this option because of the word employee security, the passage was about cyber security, I am not sure if that logic is correct\n4. On the other hand, Companies maintaing outdated tech invest heavily in the employee cybersecuirty awareness and training programs directly explains h","1. keep in mind the concept of direct and indirect explaination offered by the choices while analyzing them","Medium Cementing  Quiz 1",""],[7,"Evaluate","VRK and VRX","M","A","E","19:00",0,"Existing System Fails","1. This question was similar to AWS data analytics question, in which a company who uses data analytics service from AWS starts his own data analytics service, and the answer was what if AWS stop providing services to this company because it sees it as its competitor\n2. Same logic here VRK starts his own brand VRX, but he also endorses other brands and overall revenue will increase only if these companies do not hire some competitor actor to endorse their brand , in that case we can not say for sure that revenue will increase","1. In questions like where additional revenue/sales can be generated, always prethink scenarios in which current source of revenue may get impacted","Medium Cementing  Quiz 1",""],[8,"Other","BellaVista fell from 1 to 12 in ranking","M","D","B","25:00",0,"Entities  Missing","1. Great trap, I chose the incorrect option which mentioned that BellaVista reduced its operating capacity by 15% due to increasing ingredient prices but this situation can be a general trend for the industry, hence couldn't explain why only BellaVista ranking fell from 1 to 12\n2. Correct answer choice gave a solid reason of outdoor seating spaces provided by BellaVista. So in pleasant weather its ranking was one, and in bad weather ranking fell.\n3. Note the correct option clearly compares between BellaVista and other restaurants saying they focused on indoor sittings\n4. Learning- When two ent","1. Never choose an answer which does not give complete picture of the various entities discussed in the passage","Medium Cementing  Quiz 1",""],[9,"Weaken","MixIt Smoothie Makers","M","C","C","37:00",1,"Prethinking","1. I was able to mark the correct answer with my line of prethinking\n2. But I was not able to come up with more than 1 prethinking scenario\n3. MixIt should no longer continue making spare parts, why? One of the possibilty can be MixIt can outsource the spare making parts at a cheaper price and hence generate costs savings","1. Think harder to come up with more than 1 prethinking scenario","Medium Cementing  Quiz 1",""],[10,"Inference","Fizz- 1l and 1/2l variant","M","E","E","16:00",1,"Table Data for inference","1. My weak area - Quant based CR questions\n2. I picked random data and was able to come up with the right answer\n3. But that approach took time and I was not very confident with my selection\n4. Didn't prethink or try to infer what the data is trying to tell\n5. If the answer choice doesn't match with our representative data then reject that choice, inference must be true at all cost\n6. Beware of the timeline of the data, there traps in choices, for ex- data is about last year and choice is comparing last year and this year","1. Always try to prethink in ineference questions as well\n2. In quant based questions try to come up table if the data seems like a set\n3. Try to fill in the table with easy numbers in the set, so you can visualize\nfor ex- 1l variant -100, 1/2l variant - 100, total 200\n4. Dont fall for the timeline trap","Medium Cementing  Quiz 1",""],[11,"Strengthen","Rent Stablization","M","E","E","20:00",1,"Strengthen  with Similarity","1. Rent - These type of questions seems hard to me\n2. Here the author mentions two groups tenants of apartments and owners of mobile homes(tenants of mobile home parks)\n3. The owner of mobile home parks says the rent stabilization law does not apply to owners of mobile homes\n4.The author says no RS laws are applicable for owners of mobile homes as well\n5. To strengthen this we need a statement that says that RS laws are are based on the consideration of similar factors that must be applicable to both tenants and owners of mobile homes","1. Keep in mind strengtheners like this- something which can show similarity","Medium Cementing  Quiz 1",""],[12,"Evaluate","Govt School Teachers 7th pay  commission","M","A","B","44:00",0,"Disagreement Identification","1. Few of the govt teachers has given up the job- I don't know for some reason in mind it sounded like There are a number of teachers who are switching from govt to private jobs\n2. But few means very few or none, so it was strengthenin the conclusion that the teachers are going to stay for 5 years to reap the benefits from 7th pay commission.\n3. The first conclusion was whether qualified candidates will be attracted to the govt jobs\n4. To evaluate this doubt the correct answer choice must address this","1. When two people are arguing, try to find the goal and disagreement \nand stick only to those answer choices that addresses that","Medium Cementing  Quiz 1",""],[13,"Weaken","Targania Exports","M","E","D","41:00",0,"Unrelated to Conclusion","1. This was a repeated question so I solved it using my previous logic instead of reading the question more carefully , writing the conclusion\n2. The conclusion was to not hurt local manufacturers profit margib, Targania should shelve the plan of increasing exports\n3. The answer choice contain both of these aspects exports and local manufactures\n4. I chose option which says local manufacturers can increase their profit from selling aggressively other products, but the conclusion is about exports\n5. So the correct weakener should address increasing exports will not result in decrease of the pro","1. Id the conlucion carefully\n2. The weakener must address the conclusion reasoning not anything unrelated","Medium Cementing  Quiz 1",""],[14,"Inference","STEM curriculum in Riverside school","M","B","A","11:00",0,"Out of scope","1. I chose an answer which was clearly not mentioned in the passage \n2. It talked about a survey which was not mentioned by either critics or district spokesperson\n3. While in hurry \"Most\" word in the correct answer choice made me question the answer choice\n4. The whole disagreement was whether the new curriculum is good for students or will the students will find the new curriculum beneficial","1. While analyzing choices, make sure its mentioned or related to the passage, don't fall for out of scope trap choices","Medium Cementing  Quiz 1",""],[15,"Strengthen","Digital Infrastructure and local companies","M","B","A","7:00",0,"Generalization","1. I marked the correct choice first but changed it to incorrect one\n2. What generated the doubt in my mind is that in the passage it was mentioned that connectivity and technological tools must reach majority of the population for digital economies to advance\n3. In the correct choice only connectivity was mentioned, I thoght it is a weak strengthener as only one aspect was mentioned\n4. The answer could be in lines with both whether the rural areas have the ability to contribute to growth if connectivity/technological tools are provided and secondly the local companies have some kind of advant","1. While analyzing between choices always cross check which choice better serve the concluion directly, a generalization choice is a trap, always question such types of choices","Medium Cementing  Quiz 1",""],[16,"Strengthen","Watching Sports- Temporary Escape","M","B","A","14:00",0,"Irrelevant Comparison","1. The correct and incorrect choice both introduces a comparision\n2. The skillset required to identify relevant comparision\n3. Conclusion was temporray escape can increase performance in work related activites\n4. Correct choice which strengthens the conclusion neurological energy increases when the brain alternates between different types of activities\n5. Incorrect choice- Work related activities consumes more neurological energy than other activities not related to work- Consumes more neurological energy does not mean while doing other activites will improve performance in work","1. While analyzing choices if a comparison is made always make sure it is a valid comparison","Medium Cementing  Quiz 1",""],[17,"Evaluate","Stars into Supernova","M","C","B","57:00",0,"Correlation Vs  Cause and Effect","1. I rejected the correct answer choice as I thought it was already mentioned in the passage\n2. But in thepassage it only mentions two activities happening\n3. And in the answer choices it was pointing to cause and effect, answer to which will increase or decrease our belief in the author's conclusion\n4. Always try to find if author is trying cause and effect to come up with the conclusion when two events are simply correlated","1. Look for unwarranted cause and effect when correlation is given in the passage","Medium Cementing  Quiz 1",""],[18,"Inference","Riverside School District New teaching method","M","A","D","55:00",0,"Scope of Data, Total, Avg and Number","1. In my mind aggregate meant average, noooo, aggregate means total\n2. Total aggregated score = test scores per student * number of students\n3. According to passage test scores per student doubled in 5 years\n4. Valid Ineference- If number of students remained same then according to the above formula, total aggregate scores would also have doubled in five years\n5. Incorrect answer choice was making assumptions about individual schools when only district wide data is mentioned in the passage","1. In quant CR questions having avgs and totals always come up with a formula and then check which entities are changing or constant then move to answer choices and validate\n2. Always try to find scope of data, if data is broader, wecannot make assumptions about individual values\n3. Hence, only inference can be drawn for entities which are part of the formula","Medium Cementing  Quiz 1",""],[19,"Other","MeloStream- daily active users","M","B","E","29:00",0,"Question Stem Trap","1. MeloStreaming -> New Feature to Share Playlist -> Daily Active increases increase\n2. I didn't read the question carefully-it said despite a surge in playlist creation MeloStream's daily active users did not increase\n3. So the answer choice must address both of the aspects - 1. Increase in playlist creation 2. But no increase in daily active users\n4. Incorrect Choice -It talked about niche users similar features for genres that MeloStream does not cover- This choice explains why active user did not increase but it does not explain why there was surge in playlist in the first place\n5. Correct","1. Carefully read question also, sometimes the conclusion part is presented in the question stem","Medium Cementing  Quiz 1",""],[20,"Inference","Health Conditions in US Peopl who exercise daily  vs who don","M","E","C","52:00",0,"Correlation Vs  Cause and Effect","1. I forgot that Inference can be a restatement of the information given in the passage\n2. People who exercise consume lesser carbs than people who don't exercise\n3. Valid Inference- People who don't exercise consume more carbs than people who exercise\n4. Incorrect Option - Consuming lesser carbs and Execising daily can help in maintaining optimal weight\n5. Can- felt same , but this option introduces causality, but only correlations are mentioned in the passage , hence I should have rejected it right away\n6. Correct Answer was simply restatement which I rejected as it feels like already given ","1. Any restatement of a info mentioned in the passage can be an inference, never reject such answer choices","Medium Cementing  Quiz 1",""],[21,"Other","Speed Limits in Bravia","M","B","A","43:00",0,"Unclear Paradox Resolution","1. The passage was about after introducing speed limit in Bravia in 2005, no of fatalities significantly decreased but proportion of high speed drivers didn't change\n2. Prethinking- i.may there was some other factor that resulted in significant reduction in fatalities\n      ii. Or total number of drivers significantly reduced\n3. I rejected the correct answer which was aligned with 1st prethinking just because it mentioned post 2004.\n4. Post 2004 is noting but from 2005\n5. Incorrect choice - It says proportion of car being driven post 2005 is not same as prior to 2005\n6. Not Same means it could","1. Chose only those answers choices in a paradox question that clearly explains the paradox","Medium Cementing  Quiz 1",""],[22,"Evaluate","Virulent Microbes - WHO","M","D","E","27:00",0,"Not Related to conclusion","1. The passage only talked about reduction in \nmicrobial orgranism and hence diseases caused by it\n2. Incorrect- This choice was irrelavant to the argument as it talked about presence of other contaminant in water\n3. Conclusion- The number of fatalities can be reduced if water is treated with anti-microbial agaents before supplying to customers\n4. The argument assumes that treating water before supply will reduce contamination\n5. If contamination happens during or after the delivery , treating water beforehand wont help\n6. So if water is contaminated in at processing plants- it will help\n7. Bu","1. Timing of a proposed solution also plays a role, hence it should be a part of your pre-thinking\n2. Don't choose irrelevant choices which have new bearing on the conclusion","Medium Cementing  Quiz 1",""],[23,"Strengthen","Pressure Flaking- Early Men","M","A","C","36:00",0,"Chronological discrepancy","1. Whenever there is question related related to\ntime period, and author is making concluion, oh this tool was found in some region, and similar evidence found in some another region at an earlier date, so first party did not pioneer that tool\n2. Ask questions what if second party learn from first party in some way\n3. Incorrect Answer- I chose an incorrect answer that was talking about some new technique 'Stone Filing', this should have been rejected as it is out of scope","1. Possibility of learning from each other at different times","Medium Cementing  Quiz 1",""],[24,"Inference","Discounted Fare Program  Funding Issue","M","B","C","48:00",0,"Safe Choice  Conundrum","1. Govt Subsidies-> Restricted Scope->\nNo funding for discounted programs\n2. I rejected the answer choice because I\nthought its too extreme to conclude that If transit systems do not find ways of raising additional revenues for discounted programs they must either reduce these service or face financial loss\n3. Again chose a same choice starting with Some","1. The safe choice conundrum should be solved with solid thinking with logic","Medium Cementing  Quiz 1",""],[25,"Weaken","BurgerMan- Egg Vs Veg Sandwich","M","C","A","33:00",0,"Assumed Worldly Logic","1. When Non veg numbers are 2/3rd and veg are only 1/3rd, if veg order value is 10% more than non veg, It is not a significant number which will weaken the conlusion that introducing new non veg burger will not increase the revenues\n2. I rejected correct choice because it says non veg can eat veg sandwiches, seems far fetched\nBut it was a correct weakener, since non veg eaters can switch to veg burger but veg burger cannot , hence BurgerMan is catering to a bigger veg customer base , and introduction of new non veg burger will not increase the revenue\n3. Choosing new veg burger - 100% can buy\n","1. Take some numbers and check whether the increase is significant or not\n2. Don't reject choices as per your assumption, take it as true and analyze logically","Medium Cementing  Quiz 1",""],[26,"Bold Face","Dramatic Elevation  of academic standards","M","E","A","47:00",0,"Intermediate conclusion vs main conclsuion","1. ABC test wrongly applied","1. Do more practise on ABC test","Medium Cementing  Quiz 1",""],[27,"Other","Investment Firm Vs Financial Regulator","M","A","C","52:00",0,"Contradiction Identification","1. Everyone knows toys guns are fake, so there's \nno harm if I walk into a bank carrying gun . Let me do it\n2. Counter argument - If everyone knows toys guns are fake and serves no real purpose, why you need to carry a toy gun at all in a bank, just go normally.\n3. The same logic was used in diffult words in the passage\n4. Investment firm says the audience are able to identify that the person in the advertisement is not just an actor and not a real Financial Advisor,\nThen it still asks to ease restriction, allowing their own commercial.\n5. Finance regulator responded by the same logic as menti","1. Method of reasoning\n2. Pointing out contradictions\n3. Accepting a premise and showing it leads to a different conclusion\n4. Questioning Assumptions\n5. Providing Counter Examples","Medium Cementing  Quiz 1",""],[28,"Assumption","Britains Car Industry  and Jaguar","M","D","B","15:00",0,"Question Stem Trap","1. I didn't understand the type of question\n2. Best Explains the doubt - Assumption\n3. The author concludes that even though Jaguar \ncan solve the problem of manufaturing output and export the problem of new jobs being created will not be solved\n4. What best explains author doubt?\n5. If more automation , less number of jobs\n6. If current productivity increases, no\nneed to hire new people, less number of jobs\n7. Outsource cheap labor from outside the country, less number of jobs in Britain","1. Always try to understand the question stem, best supports- Assumption","Medium Cementing  Quiz 1",""],[29,"Inference","Sniper using vibrations of heartbeat","M","E","D","28:00",0,"Improved version of existing  trap","1. Sniper using common software, underlying\nprinciples- faceial features, biometric data\n2. New tool, underlying principle- vibrations of heartbeat\n3. Incorrect Choice- the new tool is improved version of old tool, NOOOOO, for new software which\nwas not at all mentioned in the passage\n5. Despite this limited application, all\nstudent would see improvement, I was not able \ncompletely understand this line\n6. This line meant though all students could be\nbenefitted from ","1. When conclusion is asked the correct choice should be in line with the info given in the \npassage\n2. Any choice which brings new data, or historical prediction will be eliminated as we cant\ncomment on such info","Medium Cementing  Quiz 1",""],[32,"Weaken","Searton- RDV Players and RDV Disks","M","A","B","30:00",0,"Existing System","1. Searton- sole manufacturer of RDV disks,\nRDV disks can run only on RDV players\n500 new kioks were open to sell RDV disks\n2. Conslusion- RDV playes sales did not \nincrease so RDV disks sales also will not\nincrease\n3. What if the significant number of people\nwho only own RDV players go access to RDV\ndisks through opening of new kiosks\n4. This means that even though RDV Players\nsales did not increase, the RDV disk sales will\nincrease and existing RDV Player owners \nwill buy them\n5. Learning- Whenever author predicts\nsomething about the future always think\nwhat can be changed in existing scenar","1. Look for existing scenarios which can be changed to weaken the conclusion","Medium Cementing  Quiz 1",""],[33,"Weaken","GM vs Toyota, Volt vs Prius","M","D","C","43:00",0,"C causes B","1. GM spend less on Marketing Volt that Toyota\nspend on Prius, so despite Volt winning the \nCar of the Year award, Totoyta sold Prius 4\ntimes as Volt\n2. So seems author is citing marketing the \nreason behind higher sales\n3. Causal argument- More marketing -> Higher\nSales\n4. To find a flaw we can say that what if other \nfactors than marketing are responsible for\nmore sales for Toyota Prius","1. A causes B , flaw-> C causes B","Medium Cementing  Quiz 1",""],[34,"Inference","Decline in Manufacturing leads ultimately to no longer devel","M","A","B","16:00",0,"Short Term Vs Long Term","1. Decline in Manufaturing leads to -> Process\nEngineering expertise can't be maintained \nwhich leads to-> Difficulty in conducting advance\nreasearch which leads to ->no longer develop\nnew products\n2. Great Question - This was a timing question\nOutsourcing manufacturing in the long term\n3. Short term we can cut manufacturing with \nno drawbacks\n4. Incorrect answer- To develop new products\na company must never cut down its\nmanufacturing\n5. Here the problem is never word, companies can cut down for the short term\n6. Correct Ans- I rejected this answer because it was talking about losing ability t","1. To innovate is to develop new products\n2. Timing also matters in questions like this where manufacturing, \nindustrialization or economy concepts are involved","Medium Cementing  Quiz 1",""],[35,"Evaluate","Sarah's assignment to TechFlow","M","C","E","55:00",0,"Cost-Benefit Amalysis","1. Cost- Benefit Analysis\n2. The directior said overall output of the company\nwill decline if we reassign Sarah to TechFlow\nassignment as the project will take 2X time\nthan app development project, given \nTechflow project will give an automation\nsuite which will imporve code quality and \nreduce product development lifecycle\n3. SO the director is basically questioning\nwhether reassignment of sarah and \nthe benefits of automation testing suite\nwill outweigh the production output lost\ndue to trading sarah, since she is our most\nproductive developer\n4. Incorrect Choice- Whether TechFlow\nor project","1. Whenever cost-benefit/output analysis comes always question whether the new\narrangement will outweigh the benefits from old arrangement","Medium Cementing  Quiz 1",""],[36,"Evaluate","Two year degree Vs Four year degree","M","B","E","26:00",0,"Negligence Too quick","1. I was in too much hurry while solving this ques\n2. I saw the averages and immediately presumed\nthe something related to numbers will help\nin evaluate the argument\n3. But I was wrong , the whole argument was\nabout whether two year degree is \neconomically better for students\nthan a four year degree given avg salaries\nof graduates from a two-year degree\nis 1000 dollars more than avg salaries\nof four yr degree and they two extra years\nto earn\n4. I should have asked one pertinent ques-\nwht if in the long term 4-year degree\ngraduates' total salaries is more than\ngraduates from 2-year degree?\n5. W","1. Don't hurry and presume before reading the complete argument and ans choices\n2. Never try to solve to fast, always give due diligence to the question, take time,\nanalyze and mark confidently","Medium Cementing  Quiz 1",""],[37,"Other","Schools- conforming to  dress code","M","E","B","43:00",0,"Attention To Details","1. This was a clear attention to detail error\n2. The argument concludes by saying students\ncan show their individuality and express themselves\nin schools , activities like_____________\n3. In school, this I missed while selecting ans\nchoices\n4. Incorrect choice - Various out of school volunteer work activities that showcase individual interests, \n5. I got attracted to the word individual  and chose this choice\n6. Correct choice- Mediums such as schoolwork\ninvolving creative writing, debates etc.","1. Keep keen eye about the places and time , suggested in the conclusion and reject choices \nwhich don't align with that","Medium Cementing  Quiz 1",""],[38,"Strengthen","Country X- Fish and Fish Oil Exports?","M","A","B","42:00",0,"Existing System","1. People are consuming more fish oil\n2. Huge amount of fish is required to produce\nfish oil\n. 3. Fish production cannot be increased\n4. So import either fish or fish oil\n5. Import question that can be asked is- Is\nthere a way to reduce fish consumption?\n6. If people consume less, then no need to \nimport\n7. So to strengthen that we need to import,\nwe need an answer choice which tells\nthat fish consumption is not going to decrease\nanytime sooner\n8. Correct Ans - I rejected this ans c egardless of the minor terminology variation.\nDon't automatically reject all \"other city\" options! Here's when they'","Hard Cementing Quiz  1",""],[109,"Weaken","Ulmia's blockade against Crinica's ships","H","D","E","10:00",0,"Valid Inference","1. Ulmia's navy sought to capture merhcant shipping entering and leaving Crinica's ports for four years until the dispute was resolved in Ulmia's favour \n2. It has been assumed that this blockade was crucial to the outcome\n3. But Analysis of shipping records shows that over the course of blockade, only 1/6 merchant ships attempting to enter or leave Crinica's ports were actually captured by Ulmia\n4. To weaken this we need a scenario showing that even with low capture rate the blockade is still highly effective and decisive \n5. Correct Ans- The number of ships captured each month increased shar","","Hard Cementing Quiz  1",""],[110,"Assumption","Farmers in GreenVille Pesticides vs GM seeds","H","A","D","41:00",0,"Assumption Vs Strengthen Statement","1. Farmers in GreenVille use pesticides, which is \neffective for problem of locust attack and increase yields as well\n2. Also pesticides are the cheapest way to achieve all those things\n3. But the chemicals in the pesticides cause health hazards to the consumers of the produce\n4. Then the author started talking about Genetically Modified seeds\n5. He says GM seeds are also helpful in prevention of locust attacks, increase yields and available at the comparable price as pesticides\n6. Conclusion- Hence, using GM seeds is the best way to increase yields in the next sowing season\n7. If we look care","While Analyzing choices for assumption questions always negate to check if the statement\nis a must be true condition or not, there are chances the choice is just a weakner and not\nan assumption reuqired to hold the conclusion true.\n\nIn this question we are looking for an answer choice which gives us some advantage of \nusing GM seeds over pesticides, since the author conludes that they are the best","Hard Cementing Quiz  1",""],[111,"Inference","Alaska Vaccine  Administration","H","D","E","38:00",0,"Percentages Given Numbers Chosen","1. Alaska one of 50 states of united states, has\nfully vaccinated 16% of its population, the highest rate in the country\n2. The state rank 46th in vaccine administration having used 69% of the supply\n3. Inference 1- Alaska do not have enough \nsupplies to vaccinate 100% of its population\nWhy? with 69% of used supply they able to\nvaccinate only 16% of the population\n4. Inference 2- A majority of the states have not vaccinated most of their population\nWhy?, they used more than 69% of their supply but able to vaccinate less than 16% of their population\n5. Ineference 3- If Alaska had used more than","Incorrect Ans - Alaska received more vaccines than did most other states\nIn the passage only percentages are given we cannot conculude anything about numbers","Hard Cementing Quiz  1",""],[112,"Strengthen","Haysfield Biodegradable Waste to Energy Technology","H","C","B","56:00",0,"Answer  Hidden in Double  Negatives","1. Hayfield plas to revise the disposal method\nfor residual waste\n2. Residual Waste contains a mixture of biodegradable materials and hazardous toxins \n3. Haysfield plans to use the latest biodegradable waste to energy technology to convert the biodegradable materials from the residual waste to energy , thereby making the most efficient use of such products.\n4. But what if these two - biodegradable materials and hazardous toxins are inseparable, then, Will be able to say Haysfeild is making the best use such products, NO\n5. Assumption Required- Toxins and Biodegarable materials can be separate","GMAT playes with words\nIn this question the correct answer was worded in double negatives\n\nToxins found in waste products are not indistinguishable from non toxic materials\nwhich essentially means Toxins found in waste products are distinguishable from the non\ntoxic materials, our required assumption which is also an strengthner in this case\n\nI rejected this answer choice in the first go, as in my","Hard Cementing Quiz  1",""],[113,"Other","Finance Advisors Actively Managed Mutual Funds VS Index Fund","H","D","D","18:00",1,"","1. Majority of individual investors show\nstrong preference for picking their own\nstocks or investing in actively managed\nmutual funds rather than opting for lost cost\ndiversified index funds\n2. Surprisingly this inclination remains prevalant\neven among those who are well-aware of the\nhistorical data showing that index funds typically \noutperform actively managed portfoilio\n3. What can explain this paradox","Overconfidence bias: Investors believe they are exceptions to the rule, capable of consistently beating the market despite evidence to the contrary.\nSocial influence: Scenario: Investors are highly influenced by peers, media, or financial advisors who promote active investing strategies.\nRecency bias: Investors place too much weight on recent, highly publicized success stories of individual stocks","Hard Cementing Quiz  1",""],[114,"Inference","High Stress Level, Sleeplessness, Migranes","H","E","A","28:00",0,"Combined Inference","1. High Stress Level can be accompanied by\nSleeplessness\n2. Sleeplessness leads to migrains\n3. Migraines have been found to be linked with\na strong likelihood of poor performance at work\n4. Inference- We can't say High stress level always accompanied by Sleeplessness\n\"accompanied by\" indicates co-incidental at best \n5. Valid Inference- A person with high stress level, who also suffers from sleeplessness has a high likelyhood of performing poorly at work\n6. Incorrect Ans- Someone with an increased stress level will likely perform poorly at work\nNo, thats not necessary , we need high stress leve","Combining multiple statements in an inference is the skill required in this question\naccompanied by- correlation\nleads to - causal","Hard Cementing Quiz  1",""],[115,"Weaken","GreenPower VS SolarWind","H","D","C","36:00",0,"","1. GreenPower holds leading position with 17 \nfarms\n2. SolarWind acquired WindForce network \n3. The state's env regulations presents a challenge as they prohibit any single owner from operating multiple wind farms within the same watershed \n4. Due to these restrictions, SolarWind must divest 5 wind farms to finalize the WIndForce acquisistion\n5. After this, SolarWind with its 20 wind farms will position it as the state's dominant operator\n6. Weakner- What if GreenPower already operates wind farms in most of the states watersheds\n7. This suggests that GreenPower is the only viable buyer of the ","Tough One","Hard Cementing Quiz  1",""]];

const TYPE_COLORS = {
  'Strengthen': {bg:'#eef4ff',color:'#1a4fa0',dot:'#5580d4'},
  'Weaken':     {bg:'#fff0f0',color:'#a01a1a',dot:'#d45555'},
  'Inference':  {bg:'#f0faf4',color:'#1a6b45',dot:'#55a477'},
  'Assumption': {bg:'#f7f0ff',color:'#5b3e8a',dot:'#9070cc'},
  'Bold Face':  {bg:'#fff7e6',color:'#7a4a00',dot:'#cc9530'},
  'Evaluate':   {bg:'#eef7fb',color:'#1a5a7a',dot:'#4a9ac0'},
  'Other':      {bg:'#f2f2f2',color:'#555',dot:'#888'}
};

let activeFilters = { result:'all', diff:'all', type:'all', trap:'' };
let activeSearch = '';
let activeSort = 'default';

function init() {
  const total = DATA.length;
  const wrong = DATA.filter(d=>!d[7]).length;
  const correct = total - wrong;
  const hardCount = DATA.filter(d=>d[3]==='H').length;
  const medCount = DATA.filter(d=>d[3]==='M').length;

  document.getElementById('cnt-all').textContent = total;
  document.getElementById('cnt-wrong').textContent = wrong;
  document.getElementById('cnt-correct').textContent = correct;
  document.getElementById('cnt-H').textContent = hardCount;
  document.getElementById('cnt-M').textContent = medCount;
  document.getElementById('cnt-type-all').textContent = total;

  // Header stats
  const hStats = document.getElementById('headerStats');
  hStats.innerHTML = `
    <div class="stat-pill red"><span class="val">${wrong}</span> wrong of ${total}</div>
    <div class="stat-pill amber"><span class="val">${hardCount}</span> hard</div>
    <div class="stat-pill"><span class="val">${medCount}</span> medium</div>
    <div class="stat-pill green"><span class="val">${correct}</span> correct</div>
    <div class="stat-pill"><span class="val">${Math.round(wrong/total*100)}%</span> error rate</div>
  `;

  // Type filters
  const typeCounts = {};
  DATA.forEach(d=>{ typeCounts[d[1]] = (typeCounts[d[1]]||0)+1; });
  const tf = document.getElementById('typeFilters');
  Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).forEach(([type,cnt])=>{
    const col = TYPE_COLORS[type]||TYPE_COLORS['Other'];
    tf.innerHTML += `<button class="filter-btn" data-filter="type" data-value="${type}" onclick="setFilter('type','${type}')">
      <span style="width:8px;height:8px;border-radius:50%;background:${col.dot};flex-shrink:0;"></span>
      ${type} <span class="badge">${cnt}</span></button>`;
  });

  // Trap cloud
  const trapCounts = {};
  DATA.forEach(d=>{ if(d[8]&&d[8].trim()) { const t=d[8].trim(); trapCounts[t]=(trapCounts[t]||0)+1; } });
  const topTraps = Object.entries(trapCounts).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const maxCnt = topTraps[0]?.[1]||1;
  const trapColors = ['#d4a020','#c05030','#5b3e8a','#1a6b45','#1a5a7a','#c03060'];
  const tc = document.getElementById('trapCloud');
  topTraps.forEach(([trap,cnt],i)=>{
    const sz = 10 + Math.round((cnt/maxCnt)*3);
    const col = trapColors[i%trapColors.length];
    tc.innerHTML += `<span class="trap-tag" style="background:${col}18;color:${col};font-size:${sz}px;" data-trap="${trap}" onclick="setTrap('${trap.replace(/'/g,"\\'")}')">
      ${trap.replace(/ +/g,' ')} <sup style="font-size:9px;opacity:0.7">${cnt}</sup>
    </span>`;
  });

  applyFilters();
}

function setFilter(key, val) {
  activeFilters[key] = val;
  document.querySelectorAll(`[data-filter="${key}"]`).forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`[data-filter="${key}"][data-value="${val}"]`);
  if(btn) btn.classList.add('active');
  applyFilters();
}

function setTrap(trap) {
  if(activeFilters.trap === trap) {
    activeFilters.trap = '';
    document.querySelectorAll('.trap-tag').forEach(t=>t.classList.remove('active'));
  } else {
    activeFilters.trap = trap;
    document.querySelectorAll('.trap-tag').forEach(t=>{
      t.classList.toggle('active', t.dataset.trap===trap);
    });
  }
  applyFilters();
}

function applyFilters() {
  activeSearch = document.getElementById('searchInput').value.toLowerCase();
  activeSort = document.getElementById('sortSelect').value;

  let filtered = DATA.filter(d=>{
    if(activeFilters.result==='wrong' && d[7]) return false;
    if(activeFilters.result==='correct' && !d[7]) return false;
    if(activeFilters.diff!=='all' && d[3]!==activeFilters.diff) return false;
    if(activeFilters.type!=='all' && d[1]!==activeFilters.type) return false;
    if(activeFilters.trap && (!d[8]||!d[8].toLowerCase().includes(activeFilters.trap.toLowerCase()))) return false;
    if(activeSearch) {
      const hay = (d[2]+' '+d[1]+' '+d[8]+' '+d[9]+' '+d[10]+' '+d[11]).toLowerCase();
      if(!hay.includes(activeSearch)) return false;
    }
    return true;
  });

  // Sort
  if(activeSort==='wrong-first') filtered.sort((a,b)=>a[7]-b[7]);
  else if(activeSort==='hard-first') filtered.sort((a,b)=>(a[3]==='H'?0:1)-(b[3]==='H'?0:1));
  else if(activeSort==='type') filtered.sort((a,b)=>a[1].localeCompare(b[1]));
  else if(activeSort==='trap') filtered.sort((a,b)=>(a[8]||'').localeCompare(b[8]||''));

  const wrongPct = filtered.length ? Math.round(filtered.filter(d=>!d[7]).length/filtered.length*100) : 0;
  document.getElementById('progressFill').style.width = wrongPct+'%';
  document.getElementById('resultsCount').textContent = filtered.length + ' questions';

  renderCards(filtered);
}

function renderCards(list) {
  const grid = document.getElementById('cardsGrid');
  const empty = document.getElementById('emptyState');

  if(!list.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  let lastQuiz = null;
  let html = '';

  list.forEach(d=>{
    const [id,type,name,diff,correct,selected,time,ok,trap,comments,corrective,quiz] = d;
    const col = TYPE_COLORS[type]||TYPE_COLORS['Other'];
    const isCorrect = ok===1;
    const wrongClass = isCorrect ? 'correct' : 'wrong';

    if(quiz !== lastQuiz && activeSort==='default') {
      lastQuiz = quiz;
      html += `<div class="quiz-divider"><div class="quiz-divider-line"></div><div class="quiz-divider-label">${quiz.replace(/ +/g,' ')}</div><div class="quiz-divider-line"></div></div>`;
    }

    const trapHtml = trap ? `<div class="trap-banner">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      ${trap.trim().replace(/\n/g,' ')}
    </div>` : '';

    const shortFix = corrective ? corrective.split('\n').filter(l=>l.trim())[0]||'' : '';
    const fixHtml = shortFix ? `<div class="card-corrective">${shortFix.replace(/^[\d]+\.\s*/,'').trim()}</div>` : '';

    html += `<div class="card ${wrongClass}" onclick="openModal(${id-1})" style="animation-delay:${(list.indexOf(d)%10)*0.03}s">
      <div class="card-header">
        <span class="card-num">#${id}</span>
        <div class="card-meta">
          <div class="card-title" title="${name}">${name}</div>
          <div class="card-badges">
            <span class="badge-type" style="background:${col.bg};color:${col.color}">${type}</span>
            <span class="badge-diff diff-${diff}">${diff==='H'?'HARD':diff==='M'?'MED':'EASY'}</span>
          </div>
        </div>
      </div>
      <div class="card-answer">
        <span style="font-size:11px;color:var(--text-3)">Expected</span>
        <span class="ans-chip correct">${correct}</span>
        ${!isCorrect ? `<span style="font-size:11px;color:var(--text-3)">Got</span><span class="ans-chip wrong">${selected}</span>` : `<span class="ans-chip got-right">✓ correct</span>`}
        <span class="time-chip">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${time}
        </span>
      </div>
      ${trapHtml}
      ${fixHtml}
    </div>`;
  });

  grid.innerHTML = html;
}

function openModal(idx) {
  const d = DATA[idx];
  const [id,type,name,diff,correct,selected,time,ok,trap,comments,corrective,quiz,gaps] = d;
  const col = TYPE_COLORS[type]||TYPE_COLORS['Other'];
  const isCorrect = ok===1;

  // Badges
  document.getElementById('modalBadges').innerHTML = `
    <span class="badge-type" style="background:${col.bg};color:${col.color};font-size:12px;padding:3px 10px;">${type}</span>
    <span class="badge-diff diff-${diff}" style="font-size:11px;">${diff==='H'?'HARD':diff==='M'?'MEDIUM':'EASY'}</span>
    ${isCorrect ? '<span style="background:#eef7f2;color:#1a6b45;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;">✓ Correct</span>' : '<span style="background:#fdf0ee;color:#c0392b;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;">✗ Wrong</span>'}
    <span style="font-size:11px;color:var(--text-3);margin-left:4px;">#${id} · ${quiz.trim()}</span>
  `;

  document.getElementById('modalTitle').textContent = name;

  let bodyHtml = '';

  // Answer row
  bodyHtml += `<div style="display:flex;gap:16px;align-items:center;margin-bottom:20px;padding:12px 16px;background:var(--surface2);border-radius:var(--radius-sm);">
    <div><div style="font-size:10px;color:var(--text-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">Correct answer</div>
    <span class="ans-chip correct" style="font-size:15px;padding:4px 14px;">${correct}</span></div>
    ${!isCorrect ? `<div><div style="font-size:10px;color:var(--text-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">You chose</div>
    <span class="ans-chip wrong" style="font-size:15px;padding:4px 14px;">${selected}</span></div>` : ''}
    <div style="margin-left:auto;text-align:right;">
      <div style="font-size:10px;color:var(--text-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">Time</div>
      <div style="font-family:var(--font-mono);font-size:16px;color:var(--text)">${time}</div>
    </div>
  </div>`;

  // Trap
  if(trap) {
    bodyHtml += `<div class="modal-trap">
      <span class="trap-emoji">⚠️</span>
      <div>
        <div style="font-size:10px;font-weight:400;color:#9a7020;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px;">Trap identified</div>
        <div>${trap.trim().replace(/\n/g,' ')}</div>
      </div>
    </div>`;
  }

  // Analysis
  if(comments && comments.trim()) {
    const lines = comments.split('\n').map(l=>l.trim()).filter(l=>l&&!l.match(/^[\s\*\-]+$/));
    const numbered = lines.filter(l=>l.match(/^\d+\./));
    if(numbered.length > 0) {
      bodyHtml += `<div class="modal-section">
        <div class="modal-section-label">What happened</div>
        <ul class="insights-list">
          ${numbered.map(l=>`<li>${l.replace(/^\d+\.\s*/,'')}</li>`).join('')}
        </ul>
      </div>`;
    } else {
      bodyHtml += `<div class="modal-section">
        <div class="modal-section-label">What happened</div>
        <div style="font-size:13.5px;line-height:1.7;color:var(--text);">${lines.join('<br>')}</div>
      </div>`;
    }
  }

  // Corrective actions
  if(corrective && corrective.trim()) {
    const lines = corrective.split('\n').map(l=>l.trim()).filter(l=>l&&!l.match(/^[\s\*\-]+$/));
    bodyHtml += `<div class="modal-section">
      <div class="modal-section-label">Corrective actions</div>
      <ul class="corrective-list">
        ${lines.map(l=>`<li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;color:var(--accent);margin-top:3px"><polyline points="20 6 9 17 4 12"/></svg>${l.replace(/^\d+\.\s*/,'').trim()}</li>`).join('')}
      </ul>
    </div>`;
  }

  // Conceptual gaps
  if(gaps && gaps.trim() && gaps!=='nan') {
    bodyHtml += `<div class="modal-section">
      <div class="modal-section-label">Conceptual gap</div>
      <div style="font-size:13px;color:var(--text-2);background:var(--surface2);padding:10px 14px;border-radius:var(--radius-sm);border-left:3px solid var(--amber-mid);">${gaps.replace(/\n/g,' ')}</div>
    </div>`;
  }

  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if(e.target===document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModalDirect();
});

init();
</script>
</body>
</html>
